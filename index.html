<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>RPS '49</title>
  </head>
  <body>
    <div id="root">
      <div class="gameopening">
        <div class="onboarding1 onboarding">
          <header>
            <ul class="nav">
              <li class="logo">RPS '49</li>
              <li>Made by Dibs.</li>
              <li>GitHub <i class="fa-brands fa-github" aria-hidden="true"></i></li>
            </ul>
          </header>
          <main>
            <h1 class="headline">
              <span id="first" class="typewriter"></span>
              <span id="second" class="typewriter"></span>
              <span id="third" class="typewriter"></span>
            </h1>
            <button type="button" class="arrow downarrow1" aria-label="Next screen">
              <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
            </button>
          </main>
        </div>

        <div class="onboarding2 onboarding">
          <header class="block">
            <button type="button" class="arrow uparrow" aria-label="Previous screen">
              <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
            </button>
            <h1 class="heading">RPS is Rock Paper Scissors</h1>
          </header>
          <main class="block">
            <div class="description">
              <p class="first paragraph1">Basically the game you all love and play with your peers but on a computer and interestingly with a twist.</p>
              <p class="second paragraph2">And yes the UI is beautiful too.</p>
              <div class="buttons">
                <div class="original">
                  <button type="button" class="arrow leftarrow">Prev</button>
                  <button type="button" class="arrow rightarrow">Next</button>
                </div>
                <button type="button" class="arrow downarrow2" aria-label="Choose an avatar">
                  <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="image"><img class="firstimage" src="./images/mockup.png" alt="Rock Paper Scissors game preview" /></div>
          </main>
        </div>
      </div>

      <div class="gamecontainer">
        <div class="gameplay">
          <div class="gamebar">
            <div class="leftbar">
              <div class="life playerlife" aria-label="Player score">
                <div class="lifeunit"></div><div class="lifeunit"></div><div class="lifeunit"></div><div class="lifeunit"></div><div class="lifeunit"></div>
              </div>
              <img class="profile playerprofile" src="./images/placeholder.jpeg" alt="Player Profile" />
            </div>
            <div class="round" aria-live="polite">ROUND 1</div>
            <div class="rightbar">
              <img class="profile botprofile" src="./images/mo.jpeg" alt="Robot Profile" />
              <div class="life botlife" aria-label="Mo score">
                <div class="lifeunit"></div><div class="lifeunit"></div><div class="lifeunit"></div><div class="lifeunit"></div><div class="lifeunit"></div>
              </div>
            </div>
          </div>

          <div class="gamearea">
            <div class="gameinfo" aria-live="polite">Choose One:</div>
            <div class="gamebracket">
              <div class="gamecards">
                <button type="button" class="card yellow" aria-label="Choose Rock">
                  <img class="emoji" src="images/rock.png" id="Rock" alt="" /><span class="text">Rock</span>
                </button>
                <button type="button" class="card green" aria-label="Choose Paper">
                  <img class="emoji" src="images/paper.png" id="Paper" alt="" /><span class="text">Paper</span>
                </button>
                <button type="button" class="card red" aria-label="Choose Scissors">
                  <img class="emoji" src="images/scissors.png" id="Scissors" alt="" /><span class="text">Scissors</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="avatarchoice">
        <div class="instruction">Choose an avatar:</div>
        <div class="avatars">
          <button type="button" class="avatar avatar1" aria-label="Choose Khaby"><img src="images/avatar1.png" alt="" /><span class="name">Khaby.</span></button>
          <button type="button" class="avatar avatar2" aria-label="Choose Andy"><img src="images/avatar2.png" alt="" /><span class="name">Andy.</span></button>
          <button type="button" class="avatar avatar3" aria-label="Choose Bella"><img src="images/avatar3.png" alt="" /><span class="name">Bella.</span></button>
          <button type="button" class="avatar avatar4" aria-label="Choose Stacie"><img src="images/avatar4.png" alt="" /><span class="name">Stacie.</span></button>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
